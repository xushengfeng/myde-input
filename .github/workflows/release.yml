name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # Required for OIDC
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: myde-input-reader-linux-x64
          - target: aarch64-unknown-linux-gnu
            artifact: myde-input-reader-linux-arm64

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装交叉编译工具
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: 编译
        run: cargo build --release --manifest-path rust/Cargo.toml --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: rust/target/${{ matrix.target }}/release/myde-input-reader

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 准备二进制
        run: |
          mkdir -p bin
          cp artifacts/myde-input-reader-linux-x64/myde-input-reader bin/myde-input-reader-linux-x64
          cp artifacts/myde-input-reader-linux-arm64/myde-input-reader bin/myde-input-reader-linux-arm64
          chmod +x bin/*

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: 安装依赖
        run: pnpm install

      - name: 构建 TypeScript
        run: pnpm build:ts

      - name: 运行测试
        run: pnpm test:run

      - name: 发布到 npm
        run: pnpm publish --no-git-checks

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/myde-input-reader-linux-x64
            bin/myde-input-reader-linux-arm64
